<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="みんなの川の見取り図（縮尺はでたらめ）">
<title>みんなの川の見取り図（縮尺はでたらめ）</title>
<style>
svg { --bg:#ffffff; --ink:#191919; --ink2:#666666; --grid:#e6e6e6; --band:#f2f2f2;
      --up:#257de0; --down:#f47230; --stop:#7a7a7a; --curve:#191919; --water:#257de0; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#191919; --ink:#efefef; --ink2:#9c9c9c; --grid:#333333; --band:#262626;
        --up:#338ced; --down:#e76624; --stop:#9c9c9c; --curve:#efefef; --water:#338ced; }
}
.bg { fill:var(--bg); }
.t { fill:var(--ink); font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif; }
.t2 { fill:var(--ink2); font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif; }
.grid { stroke:var(--grid); stroke-width:1; }
.axis { stroke:var(--ink2); stroke-width:1; }
.band { fill:var(--band); }
.curve { fill:none; stroke:var(--curve); stroke-width:2; stroke-linejoin:round; }
.turn { stroke:var(--ink2); stroke-width:1; stroke-dasharray:4 4; }
.up { fill:var(--up); stroke:var(--bg); stroke-width:2; }
.down { fill:var(--down); stroke:var(--bg); stroke-width:2; }
.stop { fill:var(--bg); stroke:var(--stop); stroke-width:2.5; }
.mix { fill:var(--stop); stroke:var(--bg); stroke-width:2; }
.dot { fill:var(--ink); stroke:var(--bg); stroke-width:2; }
.river { fill:none; stroke:var(--water); stroke-width:10; stroke-linecap:round; opacity:.35; }
.reach { fill:none; stroke:var(--water); stroke-width:3; }
.arrowline { fill:none; stroke:var(--ink2); stroke-width:1.5; }
</style>
<rect class="bg" x="0" y="0" width="760" height="300" rx="8"/>
<text class="t" x="20.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold">見取り図</text>
<text class="t2" x="20.0" y="50.0" font-size="12" text-anchor="start" font-weight="normal">縮尺はでたらめ。港から上の滝まではおよそ13km、階段から上の滝までは歩いて700mくらい</text>
<path class="river" d="M50,150 L710,150"/>
<path class="arrowline" d="M180,136 l-8,28"/>
<path class="arrowline" d="M190,136 l-8,28"/>
<text class="t2" x="185.0" y="184.0" font-size="11" text-anchor="middle" font-weight="normal">…約12km…</text>
<path class="arrowline" d="M620,124 L620,176" stroke-width="3"/>
<path class="reach" d="M50,100 L616,100"/>
<path class="reach" d="M616,94 L616,106"/>
<text class="t" x="335.0" y="90.0" font-size="12" text-anchor="middle" font-weight="normal">満潮のとき、潮がとどく範囲（上の滝の足元まで）</text>
<circle class="dot" cx="50" cy="150" r="6"/>
<text class="t" x="50.0" y="178.0" font-size="13" text-anchor="middle" font-weight="bold">港</text>
<text class="t2" x="50.0" y="196.0" font-size="10.5" text-anchor="middle" font-weight="normal">潮位の基準</text>
<circle class="dot" cx="320" cy="150" r="6"/>
<text class="t" x="320.0" y="178.0" font-size="13" text-anchor="middle" font-weight="bold">階段</text>
<text class="t2" x="320.0" y="196.0" font-size="10.5" text-anchor="middle" font-weight="normal">いつもの定位置</text>
<text class="t2" x="320.0" y="211.0" font-size="10.5" text-anchor="middle" font-weight="normal">湧き口のそば</text>
<circle class="dot" cx="420" cy="150" r="6"/>
<text class="t" x="420.0" y="178.0" font-size="13" text-anchor="middle" font-weight="bold">青い橋</text>
<circle class="dot" cx="510" cy="150" r="6"/>
<text class="t" x="510.0" y="178.0" font-size="13" text-anchor="middle" font-weight="bold">早瀬</text>
<text class="t2" x="510.0" y="196.0" font-size="10.5" text-anchor="middle" font-weight="normal">干潮で白く波立ち</text>
<text class="t2" x="510.0" y="211.0" font-size="10.5" text-anchor="middle" font-weight="normal">満潮で沈む</text>
<text class="t" x="630.0" y="178.0" font-size="13" text-anchor="start" font-weight="bold">上の滝</text>
<text class="t2" x="630.0" y="196.0" font-size="10.5" text-anchor="start" font-weight="normal">潮はここを</text>
<text class="t2" x="630.0" y="211.0" font-size="10.5" text-anchor="start" font-weight="normal">越えない</text>
<path class="arrowline" d="M700,136 L628,136"/>
<path class="arrowline" d="M634,131 L628,136 L634,141"/>
<text class="t2" x="704.0" y="140.0" font-size="10.5" text-anchor="start" font-weight="normal">上流の川</text>
<path class="arrowline" d="M590,245 L590,160"/>
<path class="arrowline" d="M585,166 L590,160 L595,166"/>
<text class="t2" x="590.0" y="262.0" font-size="10.5" text-anchor="middle" font-weight="normal">送られてくる水（出口は候補）</text>
</svg>