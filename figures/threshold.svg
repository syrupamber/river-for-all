<text class="t2" x="455.0" y="258.0" font-size="11" text-anchor="middle" font-weight="normal">150</text>
<line class="grid" x1="580.0" y1="70" x2="580.0" y2="240"/>
<text class="t2" x="580.0" y="258.0" font-size="11" text-anchor="middle" font-weight="normal">200</text>
<line class="grid" x1="705.0" y1="70" x2="705.0" y2="240"/>
<text class="t2" x="705.0" y="258.0" font-size="11" text-anchor="middle" font-weight="normal">250</text>
<text class="t2" x="405.0" y="286.0" font-size="12" text-anchor="middle" font-weight="normal">港の推算潮位（cm）</text>
