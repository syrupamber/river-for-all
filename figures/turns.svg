<text class="t2" x="231.0" y="74.0" font-size="12" text-anchor="start" font-weight="normal">手前と奥で逆</text>
<text class="t" x="20.0" y="102.0" font-size="13" text-anchor="start" font-weight="bold">11/25（港の干潮 12:04・97cm）</text>
<text class="t2" x="730.0" y="102.0" font-size="11.5" text-anchor="end" font-weight="normal">流れが下流→上流に変わったのは、港の干潮の24〜46分後</text>
